<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine de Equipes | Portal BelôSport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Josefin+Sans:wght@300;400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <nav class="navbar navbar-expand-lg px-3">
      <a class="navbar-brand" href="#" data-pagina-pendente="Início">
        <img src="../img/logo.png" alt="Portal BelôSport" class="logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Início">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Esportes">Esportes</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Eventos">Eventos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Mapa">Mapa</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Sobre">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Informações">Informações</a></li>
          <li class="nav-item"><a class="nav-link botao-equipes" id="linkEquipes" href="equipes.html">Equipes</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container-xxl principal">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <h2 class="titulo-fino">Equipes cadastradas</h2>
      <a id="linkNovaEquipe" href="cadastro.html" class="botao-pilula text-decoration-none">Cadastrar minha equipe</a>
    </div>

    <section class="barra-filtros mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label for="campoBusca" class="form-label small mb-1">Pesquisar</label>
          <input type="search" class="form-control" id="campoBusca" placeholder="Nome, modalidade ou responsável">
        </div>
        <div class="col-md-3">
          <label for="filtroModalidade" class="form-label small mb-1">Modalidade</label>
          <select class="form-select" id="filtroModalidade">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="ordenacao" class="form-label small mb-1">Ordenar por</label>
          <select class="form-select" id="ordenacao">
            <option value="recentes">Mais recentes</option>
            <option value="nome">Nome (A-Z)</option>
            <option value="modalidade">Modalidade (A-Z)</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="button" id="botaoLimpar" class="botao-pilula contorno py-2">Limpar</button>
        </div>
      </div>
    </section>

    <p id="contadorLista" class="text-secondary small">0 equipes</p>
    <div id="vitrine" class="row g-4"></div>
  </main>

  <footer class="rodape">Belo Horizonte · MG</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/lista.js"></script>
</body>
</html>
