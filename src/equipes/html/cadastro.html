<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Equipes | Portal BelôSport</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Josefin+Sans:wght@300;400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header class="cabecalho">
    <nav class="navbar navbar-expand-lg px-3">
      <a class="navbar-brand" href="#" data-pagina-pendente="Início">
        <img src="../img/logo.png" alt="Portal BelôSport" class="logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Início">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Esportes">Esportes</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Eventos">Eventos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Mapa">Mapa</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Sobre">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="#" data-pagina-pendente="Informações">Informações</a></li>
          <li class="nav-item"><a class="nav-link botao-equipes" id="linkEquipes" href="equipes.html">Equipes</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="container-xxl principal">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <h2 class="titulo-fino">Gestão de equipes</h2>
      <span id="seloModo" class="selo-modo">Modo: Novo cadastro</span>
    </div>

    <section class="cartao-formulario mb-5">
      <form id="formEquipe" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="campoNome" class="form-label">Nome da equipe</label>
            <input type="text" class="form-control" id="campoNome" placeholder="Ex.: nome do time" maxlength="60">
          </div>
          <div class="col-md-6">
            <label for="campoModalidade" class="form-label">Esporte / Modalidade</label>
            <input type="text" class="form-control" id="campoModalidade" list="listaModalidades" placeholder="Selecione ou digite a modalidade" maxlength="40">
            <datalist id="listaModalidades">
              <option value="Peteca"></option>
              <option value="Ultimate Frisbee"></option>
              <option value="Slackline"></option>
              <option value="Corfebol"></option>
              <option value="Tchoukball"></option>
              <option value="Bocha"></option>
              <option value="Frescobol"></option>
              <option value="Futebol de Mesa"></option>
              <option value="Capoeira"></option>
              <option value="Parkour"></option>
            </datalist>
          </div>
          <div class="col-md-4">
            <label for="campoResponsavel" class="form-label">Responsável</label>
            <input type="text" class="form-control" id="campoResponsavel" placeholder="Nome do responsável" maxlength="60">
          </div>
          <div class="col-md-4">
            <label for="campoInstagram" class="form-label">Instagram</label>
            <input type="text" class="form-control" id="campoInstagram" placeholder="@perfil_da_equipe" maxlength="31">
          </div>
          <div class="col-md-4">
            <label for="campoWhatsapp" class="form-label">WhatsApp</label>
            <input type="text" class="form-control" id="campoWhatsapp" placeholder="(DD) 9XXXX-XXXX" maxlength="15" inputmode="numeric">
          </div>
        </div>

        <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
          <button type="submit" id="botaoSalvar" class="botao-pilula">Salvar equipe</button>
          <button type="button" id="botaoCancelar" class="botao-pilula contorno">Cancelar edição</button>
          <small class="ms-md-auto text-secondary">Dados guardados no JSONServer</small>
        </div>
        <div id="mensagemFormulario" class="alert d-none mt-3" role="alert"></div>
      </form>
    </section>

    <section>
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="titulo-fino">Equipes cadastradas</h2>
        <div class="d-flex flex-wrap align-items-center gap-3">
          <small id="contadorEquipes" class="text-secondary">0 registros</small>
          <a id="linkVitrine" href="lista.html" class="botao-pilula contorno py-1 px-3 text-decoration-none">Ver vitrine de equipes</a>
        </div>
      </div>
      <div class="table-responsive border rounded">
        <table class="table table-hover tabela-equipes">
          <thead>
            <tr>
              <th>Equipe</th>
              <th>Modalidade</th>
              <th>Responsável</th>
              <th>Instagram</th>
              <th>WhatsApp</th>
              <th class="coluna-acoes">Ações</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="rodape">Belo Horizonte · MG</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/comum.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
