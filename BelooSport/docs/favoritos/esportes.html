<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BelôSport - Descubra Esportes</title>
</head>
<body>
    <!--PAGINA APENAS PARA EXEMPLIFICAR A SEÇÃO COM TODOS OS ESPORTES-->
    <header>
        <h1>Portal BelôSport</h1>
        <nav>
            <ul>
                <li><a href="../../index.html">Início</a></li>
                <li><a href="esportes.html">Esportes</a></li>

                <!--HYPERLINK PRINCIPAL-->
                <li><a href="favoritos.html">Favoritos</a></li>

                <li><a href="../mapa/mapa.html">Mapa</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="apresentacao">
            <h2>Descubra Esportes Diferentes</h2>
            <p>Explore modalidades que movimentam pessoas, criam conexões e transformam a rotina em BH.</p>
        </section>
        <!--FILTRO SIMMPLES APENAS DE EXEMPLO-->
        <section class="filtros">
            <input type="text" placeholder="Buscar esporte...">
            <button type="button">Todos</button>
            <button type="button">Aventura</button>
            <button type="button">Individual</button>
            <button type="button">Coletivo</button>
        </section>

        <section class="vitrine-esportes">
            
            <!--O BOTAO DE ESTRELA FAVORITA O ESPORTE E O ADICIONA AUTOMATICAMENTE PARA A PAGINA DE FAVORITOS-->
            <article class="card-esporte" data-id="skate">
                <div class="card-imagem">
                    <img src="skate.jpg" alt="Foto da prática de Skate">
                    <button type="button" aria-label="Favoritar Skate">☆</button>
                </div>
                <div class="card-info">
                    <h3>Skate</h3>
                    <p>Urbano · Adrenalina</p>
                </div>
            </article>

            <article class="card-esporte" data-id="escalada">
                <div class="card-imagem">
                    <img src="escalada.jpg" alt="Foto da prática de Escalada">
                    <button type="button" aria-label="Favoritar Escalada">☆</button>
                </div>
                <div class="card-info">
                    <h3>Escalada</h3>
                    <p>Aventura · Desafio</p>
                </div>
            </article>

            <article class="card-esporte" data-id="badminton">
                <div class="card-imagem">
                    <img src="badminton.jpg" alt="Foto da prática de Badminton">
                    <button type="button" aria-label="Favoritar Badminton">☆</button>
                </div>
                <div class="card-info">
                    <h3>Badminton</h3>
                    <p>Dinâmico · Social</p>
                </div>
            </article>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 BelôSport</p>
    </footer>

    <script src="favoritos.js"></script>
</body>
</html>
